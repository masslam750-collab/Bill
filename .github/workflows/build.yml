name: Build Ready ZIP
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - run: npm install
      - run: npm run build
      - name: Upload Ready Files
        uses: actions/upload-artifact@v4
        with:
          name: bill-ready-for-htdocs
          path: dist
